<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=500">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 500px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .card {
    width: 100%; height: 100%;
    background: #F8FAFC;
    display: flex; flex-direction: column;
  }
  /* 顶部工具栏 */
  .toolbar {
    background: #FFFFFF; border-bottom: 1px solid #E2E8F0;
    padding: 12px 24px; display: flex; align-items: center; gap: 12px;
    height: 52px;
  }
  .toolbar-title {
    font-size: 15px; font-weight: 600; color: #1E293B;
  }
  .toolbar-actions {
    margin-left: auto; display: flex; gap: 8px;
  }
  .btn {
    padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500;
    border: 1px solid #E2E8F0; background: #FFFFFF; color: #64748B;
    cursor: pointer;
  }
  .btn.primary {
    background: #4F46E5; color: #FFFFFF; border-color: #4F46E5;
  }
  /* 网格区域 */
  .grid {
    flex: 1; padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  /* 卡片 */
  .grid-card {
    background: #FFFFFF; border-radius: 12px;
    border: 1px solid #E2E8F0;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .grid-card-header {
    padding: 10px 16px; border-bottom: 1px solid #F1F5F9;
    font-size: 12px; font-weight: 600; color: #64748B;
    display: flex; align-items: center; gap: 6px;
  }
  .grid-card-header .drag {
    color: #CBD5E1; font-size: 14px;
  }
  .grid-card-body {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px;
  }
  /* 统计卡片内容 */
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    text-align: center;
  }
  .stat-value {
    font-size: 26px; font-weight: 700; color: #4F46E5;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
  }
  .stat-label {
    font-size: 10px; color: #94A3B8; margin-top: 2px;
  }
  /* 模拟图表 */
  .mini-chart {
    width: 100%; height: 80%;
    display: flex; align-items: flex-end; gap: 4px;
    padding: 0 8px;
  }
  .bar {
    flex: 1; border-radius: 4px 4px 0 0;
    min-height: 4px;
  }
  .bar.i { background: linear-gradient(to top, #4F46E5, #818CF8); }
  .bar.c { background: linear-gradient(to top, #0891B2, #22D3EE); }
  /* 相关性矩阵模拟 */
  .corr-matrix {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 3px; width: 100%; height: 80%;
  }
  .corr-cell {
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 500; color: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
  }
  /* 热力图颜色 */
  .corr-1 { background: #312E81; }
  .corr-08 { background: #4F46E5; }
  .corr-06 { background: #6366F1; }
  .corr-04 { background: #818CF8; }
  .corr-02 { background: #A5B4FC; }
  .corr-0 { background: #E2E8F0; }
</style>
</head>
<body>
<div class="card">
  <!-- 工具栏 -->
  <div class="toolbar">
    <span class="toolbar-title">📋 仪表板报告</span>
    <span style="font-size:12px;color:#94A3B8;">拖拽卡片调整布局</span>
    <div class="toolbar-actions">
      <span class="btn">导出 CSV</span>
      <span class="btn">导出 PNG</span>
      <span class="btn primary">+ 添加卡片</span>
    </div>
  </div>

  <!-- 网格 -->
  <div class="grid">
    <!-- 概览统计卡 -->
    <div class="grid-card">
      <div class="grid-card-header">
        <span class="drag">⋮⋮</span> 📊 概览统计
      </div>
      <div class="grid-card-body">
        <div class="stat-grid">
          <div><div class="stat-value">1.5K</div><div class="stat-label">总行数</div></div>
          <div><div class="stat-value">8</div><div class="stat-label">列数</div></div>
          <div><div class="stat-value">37</div><div class="stat-label">缺失值</div></div>
          <div><div class="stat-value">0.3%</div><div class="stat-label">缺失率</div></div>
        </div>
      </div>
    </div>

    <!-- 销售额分布 -->
    <div class="grid-card">
      <div class="grid-card-header">
        <span class="drag">⋮⋮</span> 📈 销售额分布
      </div>
      <div class="grid-card-body">
        <div class="mini-chart">
          <div class="bar i" style="height:30%"></div>
          <div class="bar i" style="height:50%"></div>
          <div class="bar i" style="height:80%"></div>
          <div class="bar i" style="height:100%"></div>
          <div class="bar i" style="height:90%"></div>
          <div class="bar i" style="height:70%"></div>
          <div class="bar i" style="height:45%"></div>
          <div class="bar i" style="height:25%"></div>
        </div>
      </div>
    </div>

    <!-- 区域销售对比 -->
    <div class="grid-card">
      <div class="grid-card-header">
        <span class="drag">⋮⋮</span> 📊 区域销售对比
      </div>
      <div class="grid-card-body">
        <div class="mini-chart" style="gap:12px;">
          <div class="bar i" style="height:85%"></div>
          <div class="bar c" style="height:62%"></div>
          <div class="bar i" style="height:90%"></div>
          <div class="bar c" style="height:45%"></div>
        </div>
      </div>
    </div>

    <!-- 相关性热力图 -->
    <div class="grid-card" style="grid-column: span 2;">
      <div class="grid-card-header">
        <span class="drag">⋮⋮</span> 🔥 相关性热力图
      </div>
      <div class="grid-card-body">
        <div class="corr-matrix" style="max-width:240px;">
          <div class="corr-cell corr-1">1.0</div>
          <div class="corr-cell corr-08">0.8</div>
          <div class="corr-cell corr-02">0.2</div>
          <div class="corr-cell corr-04">0.4</div>
          <div class="corr-cell corr-08">0.8</div>
          <div class="corr-cell corr-1">1.0</div>
          <div class="corr-cell corr-0">0.0</div>
          <div class="corr-cell corr-06">0.6</div>
          <div class="corr-cell corr-02">0.2</div>
          <div class="corr-cell corr-0">0.0</div>
          <div class="corr-cell corr-1">1.0</div>
          <div class="corr-cell corr-02">0.2</div>
          <div class="corr-cell corr-04">0.4</div>
          <div class="corr-cell corr-06">0.6</div>
          <div class="corr-cell corr-02">0.2</div>
          <div class="corr-cell corr-1">1.0</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
